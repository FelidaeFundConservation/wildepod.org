name: Cleanup Outdated Snyk PRs

on:
  pull_request:
    types: [opened]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry Run (Log actions without closing PRs)"
        type: boolean
        required: true
        default: true
  push: # <-- Keep your temporary test trigger here

jobs:
  cleanup:
    if: |
      github.event_name == 'workflow_dispatch' || 
      github.event_name == 'push' || 
      (github.event_name == 'pull_request' && contains(github.event.pull_request.user.login, 'snyk'))
    
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # FIX: Write the filter safely into a real file. 
      # The > operator preserves all structural formatting perfectly.
      - name: Create JQ Filter Script
        run: |
          cat > filter.jq << 'EOF'
          [ .[] | 
            .title as $title | 
            .number as $number |
            ($title | capture("\\[Snyk\\] Upgrade (?<package>[^ ]+) from [^ ]+ to (?<version>[0-9A-Za-z.+-]+)")?) |
            select(. != null) |
            {number: $number, title: $title, package: .package, version: .version}
          ] | 
          group_by(.package) | 
          .[] | 
          if length > 1 then 
            sort_by(.version | split(".") | map(tonumber? // 0)) | 
            .[:-1] | 
            .[] | 
            "\(.number)|\(.title)" 
          else 
            empty 
          fi
          EOF

      - name: Close older duplicate PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run == true || (github.event_name != 'workflow_dispatch' && github.event_name != 'pull_request') }}
        run: |
          echo "Fetching open Snyk PRs..."
          prs=$(gh pr list --author "jdorapalli" --state open --json number,title --limit 100)
          
          if [ "$(echo "$prs" | jq '. | length')" -eq 0 ]; then
            echo "No open Snyk PRs found."
            exit 0
          fi

          echo "Evaluating duplicates..."
          
          # FIX: Execute the filter from the safely preserved file (-f filter.jq)
          old_prs=$(echo "$prs" | jq -r -f filter.jq)

          if [ -z "$old_prs" ]; then
            echo "All Snyk PRs are up to date. No older duplicates found."
            exit 0
          fi

          echo "Processing stale duplicates..."
          echo "$old_prs" | while IFS="|" read -r pr_number pr_title; do
            if [ -z "$pr_number" ]; then continue; fi
            
            if [ "$DRY_RUN" = "true" ]; then
              echo "[DRY RUN] Would close PR #$pr_number: \"$pr_title\""
            else
              echo "Closing older duplicate Snyk PR: #$pr_number"
              gh pr close "$pr_number" --comment "Closing automatically: A newer Snyk update exists for this package."
            fi
          done
