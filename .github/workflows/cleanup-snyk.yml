name: Cleanup Outdated Snyk PRs

on:
  pull_request:
    types: [opened]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry Run (Log actions without closing PRs)"
        type: boolean
        required: true
        default: true
  push:

jobs:
  cleanup:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.user.login, 'snyk'))

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    env:
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 1. Fetch Open Snyk PRs
        id: fetch_prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Querying GitHub API for open Snyk PRs..."
          gh pr list --author "jdorapalli" --state open --limit 1000 --json number,title,body > open_prs.json
          PR_COUNT=$(jq '. | length' open_prs.json)
          echo "Found $PR_COUNT open Snyk PRs."
          echo "count=$PR_COUNT" >> "$GITHUB_OUTPUT"

      - name: 2. Fetch PR file diffs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          with open("open_prs.json", "r", encoding="utf-8") as f:
              prs = json.load(f)

          results = []
          for pr in prs:
              number = pr["number"]
              cmd = [
                  "gh",
                  "api",
                  f"repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{number}/files",
                  "--paginate",
              ]
              proc = subprocess.run(cmd, capture_output=True, text=True, check=True)
              files = json.loads(proc.stdout or "[]")
              results.append({
                  "number": number,
                  "title": pr.get("title"),
                  "files": files,
              })

          with open("pr_files.json", "w", encoding="utf-8") as f:
              json.dump(results, f, indent=2)
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: python -m pip install packaging

      - name: Parse Snyk PR bodies and file diffs
        run: python .github/scripts/triage_snyk_prs.py

      - name: Upload triage results
        uses: actions/upload-artifact@v4
        with:
          name: snyk-pr-triage
          path: |
            retained_prs.json
            close_prs.json

      - name: Show retained PRs
        run: |
          echo "=== retained_prs.json ==="
          python - <<'PY'
          import json
          try:
              with open("retained_prs.json") as f:
                  data = json.load(f)
              print(json.dumps(data, indent=2))
          except FileNotFoundError:
              print("retained_prs.json not found")
          PY

      - name: Show close candidates
        run: |
          echo "=== close_prs.json ==="
          python - <<'PY'
          import json
          try:
              with open("close_prs.json") as f:
                  data = json.load(f)
              print(json.dumps(data, indent=2))
          except FileNotFoundError:
              print("close_prs.json not found")
          PY

      - name: Close stale PRs
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          path = "close_prs.json"
          try:
              with open(path, "r", encoding="utf-8") as f:
                  prs = json.load(f)
          except FileNotFoundError:
              print(f"{path} not found; nothing to close.")
              raise SystemExit(0)

          for pr in prs:
              number = pr["number"]
              print(f"Closing PR #{number}: {pr.get('title')}")
              result = subprocess.run(
                  ["gh", "pr", "close", str(number), "--delete-branch"],
                  capture_output=True,
                  text=True,
                  env={**os.environ, "GH_TOKEN": os.environ["GH_TOKEN"]},
              )
              print(result.stdout, end="")
              print(result.stderr, end="")
              if result.returncode != 0:
                  # Branch deletion can fail for forks or protected refs; the close itself is what matters.
                  print(f"::warning::Could not fully clean up PR #{number} (exit {result.returncode}).")
          PY
