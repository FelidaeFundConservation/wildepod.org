name: Cleanup Outdated Snyk PRs

on:
  pull_request:
    types: [opened]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry Run (Log actions without closing PRs)"
        type: boolean
        required: true
        default: true
  push: # <-- Keep your temporary test trigger here

jobs:
  cleanup:
    if: |
      github.event_name == 'workflow_dispatch' || 
      github.event_name == 'push' || 
      (github.event_name == 'pull_request' && contains(github.event.pull_request.user.login, 'snyk'))
    
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 1. Fetch Open Snyk PRs
        id: fetch_prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Querying GitHub API for open Snyk PRs..."
          # Fetch PRs and write to a clean temporary JSON file
          gh pr list --author "jdorapalli" --state open --limit 1000 --json number,title,body > open_prs.json
          
          # Check if the list is empty using a very basic jq check
          PR_COUNT=$(jq '. | length' open_prs.json)
          echo "Found $PR_COUNT open Snyk PRs."
          
          # Save count to outputs so future steps can skip if 0
          echo "count=$PR_COUNT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: python -m pip install packaging

      - name: Parse Snyk PR bodies
        run: python .github/scripts/triage_snyk_prs.py

      - name: Upload triage results
        uses: actions/upload-artifact@v4
        with:
          name: snyk-pr-triage
          path: |
            retained_prs.json
            close_prs.json

      - name: Show retained PRs
        run: |
          echo "=== retained_prs.json ==="
          python - <<'PY'
          import json
          try:
              with open("retained_prs.json") as f:
                  data = json.load(f)
              print(json.dumps(data, indent=2))
          except FileNotFoundError:
              print("retained_prs.json not found")
          PY

      - name: Show close candidates
        run: |
          echo "=== close_prs.json ==="
          python - <<'PY'
          import json
          try:
              with open("close_prs.json") as f:
                  data = json.load(f)
              print(json.dumps(data, indent=2))
          except FileNotFoundError:
              print("close_prs.json not found")
          PY

      - name: Close stale PRs
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import subprocess
          import os

          path = "close_prs.json"
          try:
              with open(path) as f:
                  prs = json.load(f)
          except FileNotFoundError:
              print(f"{path} not found; nothing to close.")
