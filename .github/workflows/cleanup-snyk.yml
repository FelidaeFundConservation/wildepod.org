name: Cleanup Outdated Snyk PRs

on:
  pull_request:
    types: [opened]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry Run (Log actions without closing PRs)"
        type: boolean
        required: true
        default: true
  push:
  
jobs:
  cleanup:
    # Fix: Removed the multi-line pipe and stripped the fragile 'Bot' type check
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.user.login, 'snyk'))

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Close older duplicate PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fix: Explicitly force the boolean into a string comparison
          DRY_RUN: ${{ github.event.inputs.dry_run == true || github.event_name == 'pull_request' }}
        run: |
          echo "Fetching open Snyk PRs..."
          
          # Fix: Snyk uses 'snyk-bot' as the author in the GitHub CLI tool, not 'app/snyk-bot'
          prs=$(gh pr list --author "jdorapalli" --state open --json number,title --limit 100)
          
          if [ "$(echo "$prs" | jq '. | length')" -eq 0 ]; then
            echo "No open Snyk PRs found."
            exit 0
          fi

          echo "Evaluating duplicates..."
          
          # Fix: Optimized jq extraction to handle semantic versions Safely
          old_prs=$(echo "$prs" 
            | jq -r '[.[] 
            | .title as $t 
            | .number as $n 
            | ($t | capture("\\[Snyk\\] Upgrade (?<p>[^ ]+) from [^ ]+ to (?<v>[0-9A-Za-z.+-]+)")?) | select(. != null) 
            | {number: $n, title: $t, package: .p, version: .v}] 
            | group_by(.package) 
            | .[] 
            | if length > 1 then (sort_by(.version | split(".") | map(tonumber? // 0)) | .[:-1] | .[] 
            | "\(.number)|\(.title)") 
            else empty end')

          if [ -z "$old_prs" ]; then
            echo "All Snyk PRs are up to date. No older duplicates found."
            exit 0
          fi

          # Process the identified old PRs
          echo "$old_prs" | while IFS="|" read -r pr_number pr_title; do
            if [ "$DRY_RUN" = "true" ]; then
              echo "[DRY RUN] Would close PR #$pr_number: \"$pr_title\""
            else
              echo "Closing older duplicate Snyk PR: #$pr_number"
              gh pr close "$pr_number" --comment "Closing automatically: A newer Snyk update exists for this package."
            fi
          done
