name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Real values are stored as GitHub Actions repository variables or secrets.
  # Set them under: Settings → Secrets and variables → Actions
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
  GCP_DB_INSTANCE: ${{ vars.GCP_DB_INSTANCE || secrets.GCP_DB_INSTANCE || 'wildepoddb' }}
  GCP_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION || 'us-west2' }}
  STAGING_DB_PORT: 5440
  # Name of the Django settings secret in GCP Secret Manager for staging
  STAGING_SETTINGS_NAME: ${{ vars.STAGING_SETTINGS_NAME || secrets.STAGING_SETTINGS_NAME || 'django_settings' }}
  BYPASS_FLAKE8: "true"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci
      DJANGO_CI_MODE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: DJANGO_SETTINGS_MODULE=config.settings.ci DJANGO_CI_MODE=true uv run pytest

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn

      - name: Run flake8
        if: ${{ env.BYPASS_FLAKE8 != 'true' }}
        run: uv run flake8

  deploy:
    name: Deploy to Staging
    needs: test
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci
      DJANGO_CI_MODE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Install sass
        run: npm install -g sass

      - name: Compile SASS
        run: sass --style compressed ./siteapps/static/scss/main.scss:./siteapps/static/css/main.css

      - name: Regenerate requirements.txt
        run: uv export --no-hashes -o requirements.txt

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Collect static files
        run: |
          set -euo pipefail
          while IFS= read -r css_file; do
            map_file="${css_file%.css}.map"
            if [[ ! -f "$map_file" ]]; then
              sed -i '/sourceMappingURL=.*\.map/d' "$css_file"
            fi
          done < <(find .venv -type f -name '*.css')
          uv run python manage.py collectstatic --noinput --settings=config.settings.ci

      - name: Deploy to App Engine
        run: gcloud app deploy staging.yaml --quiet --project=$CLOUDSDK_CORE_PROJECT

  migrate:
    name: Run Migrations
    needs: deploy
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
      USE_CLOUD_SQL_AUTH_PROXY: "True"
      SETTINGS_NAME: ${{ vars.STAGING_SETTINGS_NAME || secrets.STAGING_SETTINGS_NAME || 'django_settings' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate migration configuration
        run: |
          missing=0
          if [ -z "${{ env.GCP_PROJECT_ID }}" ]; then
            echo "Missing required setting: GCP_PROJECT_ID"
            missing=1
          fi
          if [ -z "${{ env.GCP_REGION }}" ]; then
            echo "Missing required setting: GCP_REGION"
            missing=1
          fi
          if [ -z "${{ env.GCP_DB_INSTANCE }}" ]; then
            echo "Missing required setting: GCP_DB_INSTANCE"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Target Cloud SQL Instance Name: ${{ env.GCP_DB_INSTANCE }}"
          echo "Full Cloud SQL Connection String: ${{ env.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:${{ env.GCP_DB_INSTANCE }}"

      - name: Download Cloud SQL Proxy
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy

      - name: Start Cloud SQL Proxy
        run: |
          set -euo pipefail
          ./cloud-sql-proxy \
            --address=127.0.0.1 \
            --port=${{ env.STAGING_DB_PORT }} \
            "${{ env.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:${{ env.GCP_DB_INSTANCE }}" > cloud-sql-proxy.log 2>&1 &
          proxy_pid=$!

          for attempt in {1..30}; do
            if ! kill -0 "$proxy_pid" 2>/devnull; then
              echo "Cloud SQL Proxy exited before opening port ${{ env.STAGING_DB_PORT }}"
              cat cloud-sql-proxy.log
              exit 1
            fi

            if nc -z 127.0.0.1 "${{ env.STAGING_DB_PORT }}"; then
              echo "Cloud SQL Proxy is listening on 127.0.0.1:${{ env.STAGING_DB_PORT }}"
              exit 0
            fi

            sleep 1
          done

          echo "Cloud SQL Proxy did not open port ${{ env.STAGING_DB_PORT }}"
          cat cloud-sql-proxy.log
          exit 1

      - name: Run migrations
        run: |
          set -o pipefail
          if ! uv run python manage.py migrate --settings=config.settings.staging 2>&1 | tee migration_output.txt; then
            echo "::error::Staging database migration failed. Cloud SQL Proxy output log:"
            cat cloud-sql-proxy.log 2>/dev/null || true
            exit 1
          fi

      - name: Write migration summary
        if: always()
        run: |
          echo "## Staging Migrations" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat migration_output.txt 2>/dev/null || echo "(no migration output available)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f cloud-sql-proxy.log ]; then
            echo "### Cloud SQL Proxy Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat cloud-sql-proxy.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
