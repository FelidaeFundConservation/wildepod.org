name: PR Build

on:
  pull_request:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci
      DJANGO_CI_MODE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest

      - name: Run flake8
        run: uv run flake8

      - name: Install sass
        run: npm install -g sass

      - name: Compile SASS
        run: sass --style compressed ./siteapps/static/scss/main.scss:./siteapps/static/css/main.css

      - name: Collect static files
        run: uv run python manage.py collectstatic --noinput --settings=config.settings.ci
