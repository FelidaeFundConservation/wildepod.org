name: PR Build

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.ci
      DJANGO_CI_MODE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn

      - name: Run flake8
        run: uv run flake8
        continue-on-error: true

      - name: Install sass
        run: npm install -g sass

      - name: Compile SASS
        run: sass --style compressed ./siteapps/static/scss/main.scss:./siteapps/static/css/main.css

      - name: Collect static files
        run: |
          set -euo pipefail
          # Some dependencies (jazzmin) ship minified CSS ending in a
          # `/*# sourceMappingURL=... */` comment but no accompanying .map file.
          # whitenoise's manifest storage resolves those references during
          # collectstatic post-processing and hard-fails on the missing file.
          # Drop the dangling references before collecting. Mirrors the same
          # step in deploy-staging.yml / deploy-prod.yml, except this removes
          # only the comment rather than the whole line, so a dependency that
          # ever emits the comment inline doesn't lose its stylesheet.
          while IFS= read -r css_file; do
            if ! grep -q 'sourceMappingURL' "$css_file"; then
              continue
            fi
            map_file="${css_file}.map"
            if [[ ! -f "$map_file" && ! -f "${css_file%.css}.map" ]]; then
              sed -i 's|/\*# sourceMappingURL=[^*]*\*/||g' "$css_file"
            fi
          done < <(find .venv -type f -name '*.css')
          uv run python manage.py collectstatic --noinput --settings=config.settings.ci
