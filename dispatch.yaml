dispatch:
  # Route all requests to wildepod.org (and its paths) to the default service
  - url: "wildepod.org/*"
    service: default

  # Route all requests to the subdomain bhutan.wildepod.org to the bhutan service
  - url: "bhutan.wildepod.org/*"
    service: bhutan

  # Route all requests to wildebackyard.com (and its paths) to the default service
  - url: "wildebackyard.com/*"
    service: wildebackyard-web

  # Route all requests to www.wildebackyard.com (and its paths) to the default service
  - url: "www.wildebackyard.com/*"
    service: wildebackyard-web
