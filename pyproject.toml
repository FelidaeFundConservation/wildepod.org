[project]
name = "wildepod"
version = "1.0.0"
description = "Django Website for WildePod (Felidae Conservation Fund)"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {text = "Proprietary"}

dependencies = [
    # Authentication & Security
    "argon2-cffi==21.3.0",
    # Django Core
    "crispy-bootstrap5==0.6",
    "django==4.2.16",
    "django-allauth==0.51.0",
    "django-braces==1.15.0",
    "django-crispy-forms==1.14.0",
    "django-environ==0.9.0",
    "django-extensions==3.2.1",
    "django-jazzmin==2.4.9",
    "django-model-utils>=5.0.0",
    "django-simple-history>=3.8.0",
    "django-storages[google]==1.12.3",
    # Cloud Storage & APIs
    "dropbox>=11.30.0",
    "google-api-python-client>=2.58.0",
    "google-auth>=2.11.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=0.5.2",
    "google-cloud-datastore>=2.13.0",
    "google-cloud-secret-manager>=2.26.0",
    # Production Services
    "Collectfast==2.2.0",
    "google-cloud-logging>=3.2.2",
    "google-cloud-tasks>=2.12.1",
    "gunicorn==20.1.0",
    # Data Processing
    "numpy==1.26.4",
    "pandas==2.2.3",
    # Image Processing & Utilities
    "Pillow==10.4.0",
    "psycopg2-binary==2.9.9",
    "python-slugify==6.0.1",
    "pytz==2021.3",
    "rcssmin==1.1.0",
    # Third Party Libs
    "requests==2.27.1",
    "whitenoise==6.4.0",
    "matplotlib>=3.10.8",
]

[project.optional-dependencies]
dev = [
    # Code Formatting
    "black==22.1.0",

    # Testing
    "coverage==6.3.1",
    "django-coverage-plugin==2.0.2",
    "factory-boy==3.2.1",
    "pytest==7.0.1",
    "pytest-django==4.5.2",
    "pytest-sugar==0.9.4",

    # Development Tools
    "django-debug-toolbar==3.2.4",
    "django-schema-viewer",
    "django-stubs==1.9.0",
    "djlint==1.34.0",
    "jupyter",
    "jsbeautifier==1.14.11",

    # Code Quality
    "flake8==4.0.1",
    "flake8-isort==4.1.1",
    "mypy==0.931",
    "pre-commit==2.17.0",
    "pylint-django==2.5.0",

    # Type Checking
    "types-requests==2.27.15",

    # ML/AI
    "onnx==1.15.0",
    "yolov9pip",
]

[tool.black]
line-length = 120
target-version = ['py310']
exclude = '''
/(
    \.git
  | \.venv
  | siteapps/.*/migrations
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 120
skip_glob = ["*/migrations/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py", "*_test.py", "testing/python/*.py"]
addopts = "--reuse-db"

[tool.mypy]
python_version = "3.10"
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.local"

