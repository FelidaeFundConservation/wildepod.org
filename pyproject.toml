[project]
name = "wildepod"
version = "1.0.0"
description = "Django Website for WildePod (Felidae Conservation Fund)"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {text = "Proprietary"}

dependencies = [
    # Authentication & Security
    "argon2-cffi==21.3.0",

    # Django Core
    "crispy-bootstrap5==0.6",
    "django==4.2.16",
    "django-allauth==0.51.0",
    "django-braces==1.15.0",
    "django-crispy-forms==1.14.0",
    "django-environ==0.9.0",
    "django-extensions==3.2.1",
    "django-jazzmin==2.4.9",
    "django-model-utils>=5.0.0",
    "django-simple-history>=3.8.0",
    "django-storages[google]==1.12.3",

    # Cloud Storage & APIs
    "dropbox>=11.30.0",
    "google-api-python-client>=2.58.0",
    "google-auth>=2.11.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=0.5.2",
    "google-cloud-datastore>=2.13.0",
    "google-cloud-secret-manager>=2.26.0",

    # Production Services
    "Collectfast==2.2.0",
    "google-cloud-logging>=3.2.2",
    "google-cloud-tasks>=2.12.1",
    "gunicorn==20.1.0",

    # Data Processing
    "numpy==1.26.4",
    "pandas==2.2.3",

    # Image Processing & Utilities
    "Pillow==10.4.0",
    "psycopg2-binary==2.9.9",
    "python-slugify==6.0.1",
    "pytz==2021.3",
    "rcssmin==1.1.0",

    # Third Party Libs
    "requests==2.27.1",
    "whitenoise==6.4.0",
]

[project.optional-dependencies]
dev = [
    # Code Formatting
    "black>=24.0.0",

    # Testing
    "coverage>=7.0.0",
    "django-coverage-plugin>=3.0.0",
    "factory-boy>=3.3.0",
    "pytest>=8.0.0",
    "pytest-cov>=3.0.0",
    "pytest-django>=4.5.0",
    "pytest-sugar>=1.0.0",
    "pytest-xdist>=2.5.0",

    # Development Tools
    "django-debug-toolbar>=4.0.0",
    "django-stubs>=5.0.0",
    "djlint>=1.35.0",
    "jupyter",
    "jsbeautifier>=1.15.0",

    # Code Quality
    "flake8>=7.0.0",
    "flake8-isort>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit==4.5.1",
    "pylint-django>=2.5.0",

    # Type Checking
    "types-requests>=2.31.0",

    # ML/AI
    "onnx>=1.15.0",
    "yolov9pip",
]

[tool.black]
line-length = 120
target-version = ['py310']
exclude = '''
/(
    \.git
  | \.venv
  | siteapps/.*/migrations
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 120
skip_glob = ["*/migrations/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py", "*_test.py", "testing/python/*.py"]
addopts = [
    "--reuse-db",
    "--cov=siteapps",
    "--cov=config",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-config=pyproject.toml",
    "-v",
]
testpaths = ["siteapps"]
norecursedirs = [
    ".git",
    ".venv",
    "*.egg",
    "dist",
    "build",
    "migrations",
    "node_modules",
]

[tool.coverage.run]
source = ["siteapps", "config"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/node_modules/*",
    "*/templates/*",
    "manage.py",
    "*/wsgi.py",
    "*/asgi.py",
    "scratch/*",
    # Omit small boilerplate files (< 25 lines)
    "*/__init__.py",
    "*/apps.py",
    "*/urls.py",
    "*/tests.py",
    "*/admin.py",
    "*/adapters.py",
    "*/context_processors.py",
    "*/storages.py",
    "config/wsgi/*.py",
    "config/settings/dev.py",
    "config/settings/local.py",
    # Omit minimal stub/placeholder files (1-12 lines)
    "siteapps/backyard/models.py",
    "siteapps/exports/models.py",
    "siteapps/home/models.py",
    "siteapps/home/views.py",
    "siteapps/inventory/views.py",
    "siteapps/explore/views/index.py",
    "siteapps/explore/views/map.py",
    "siteapps/backyard/views.py",
    "siteapps/explore/utils.py",
    "siteapps/images/models/custom_fields.py",
]
plugins = ["django_coverage_plugin"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if settings.DEBUG",
    "@abstract",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
python_version = "3.10"
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.local"

[dependency-groups]
dev = [
    "black>=22.1.0",
    "djlint>=1.34.0",
    "flake8>=4.0.1",
    "flake8-bugbear>=23.3.12",
    "flake8-comprehensions>=3.17.0",
    "flake8-mutable>=1.2.0",
    "flake8-print>=5.0.0",
    "flake8-simplify>=0.30.0",
    "isort>=5.13.2",
    "jupyter>=1.1.1",
    "jupytext>=1.19.0",
    "nbconvert>=7.16.6",
    "pre-commit>=2.17.0",
    "pycln>=2.6.0",
]
