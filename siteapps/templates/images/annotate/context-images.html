{% load static %}

<div id="context-images-overlay">
</div>

<script>
    // Create the overlay.
    let contextImagesOverlay = document.getElementById("context-images-overlay");

    Object.assign(contextImagesOverlay.style, {
        "display": "none",
        "position": "fixed",
        "top": "0",
        "left": "0",
        "align-items": "center",
        "width": "100%",
        "height": "100%",
        "max-height": "100%",
        "background-color": "rgba(0,0,0,0.5)",
        "z-index": "2",
        "flex-wrap": "nowrap",
    });

    const contextImagePaths = [
        {% for image in context_images %}
        "{{ image.thumbnail_gcloud_path }}",
        {% endfor %}
    ];

    // Create horizontally scrolling image container.
    const imageContainer = document.createElement("div");
    Object.assign(imageContainer.style, {
        "display": "flex",
        "flex-wrap": "nowrap",
        "overflow-x": "scroll",
        "justify-content": "left",
        "align-items": "center",
    });

    function addImage(path) {
        const image = document.createElement("img");
        Object.assign(image.style, {
            "display": "inline-block",
            "object-position": "center",
            "max-width": "100%",
            "height": "600px",
            "white-space": "nowrap",
        });
        image.setAttribute("id", path);
        image.setAttribute("class", "img-fluid m-0 p-0");
        image.setAttribute("src", `{% get_media_prefix %}${path}`);

        imageContainer.appendChild(image);
        return image;
    }

    // Keep track of all image elements to apply image filters to.
    window.contextImageElements = [];

    for (const path of contextImagePaths) {
        contextImageElements.push(addImage(path));
    }
    contextImagesOverlay.appendChild(imageContainer);

    // Button to hide the context image overlay.
    const closeOverlayButton = document.createElement("button");
    closeOverlayButton.setAttribute("id", `close-overlay-button`);
    closeOverlayButton.textContent = "Hide Context Overlay";
    Object.assign(closeOverlayButton.style, {
        display: "flex",
        width: "30%",
        position: "fixed",
        bottom: "40px",
        left: "50%",
        transform: "translateX(-50%)",
        fontSize: "2.0em",
        justifyContent: "center",
        alignItems: "center",
        textAlign: "center",
    });

    closeOverlayButton.addEventListener('click', (function () {
        contextImagesOverlay.style.display = "none";
    }));
    contextImagesOverlay.appendChild(closeOverlayButton);

    // Container to hold the overlay open button.
    const contextImageControls = document.createElement("div");
    contextImageControls.setAttribute("id", "context-images-controls");
    contextImageControls.setAttribute("class", "mt-3");
    Object.assign(contextImageControls.style, {
      "border": "1px solid black",
      "border-radius": "5px",
      "padding": "20px"
    });

    const contextImageControlsTitle = document.createElement("h5");
    contextImageControlsTitle.textContent = "View Context Images";
    contextImageControls.appendChild(contextImageControlsTitle);

    // Button to show the context image overlay.
    const openOverlaybutton = document.createElement('button');
    openOverlaybutton.setAttribute("id", `open-overlay-button`);
    openOverlaybutton.textContent = "Show Overlay";
    Object.assign(openOverlaybutton.style, {
        marginTop: "10px",
        fontSize: "1.0em"
    });

    openOverlaybutton.addEventListener('click', (function () {
        contextImagesOverlay.style.display = "flex";
    }));
    contextImageControls.appendChild(openOverlaybutton);

    document.getElementById("image-manipulator-sliders").parentNode.appendChild(contextImageControls);

</script>
