{% load static %}
<div id="context-images-overlay" class="carousel slide" data-ride="carousel">
    <ol class="carousel-indicators"></ol>

    <!-- Slides -->
    <div class="carousel-inner"></div>

    <!-- Controls -->
    <a class="carousel-control-prev" href="#my-carousel" role="button" data-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="sr-only">Previous</span>
    </a>
    <a class="carousel-control-next" href="#my-carousel" role="button" data-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="sr-only">Next</span>
    </a>
</div>
<script>

    let contextImagesOverlay = document.getElementById("context-images-overlay");

    Object.assign(contextImagesOverlay.style, {
        "position": "fixed",
        "display": "flex",
        "justify-content": "center",
        "align-items": "center",
        "width": "100%",
        "height": "100%",
        "max-height": "100%",
        "top": "0",
        "left": "0",
        "right": "0",
        "bottom": "0",
        "background-color": "rgba(0,0,0,0.5)",
        "z-index": "2",
        "overflow-x": "scroll",
        "overflow-y": "hidden",
        "display": "none",
        "flex-wrap": "nowrap",
    });

    const contextImages = [
        {% for image in context_image_gcloud_paths %}
         "{{image}}",
        {% endfor %}
    ];

    function addImage(url) {
        const image = document.createElement("img");
        Object.assign(image.style, {
            "display": "inline-block",
            "object-position": "center",
            "max-width": "100%",
            "max-height": "100%",
            "white-space": "nowrap",
        });
        image.setAttribute("id", url);
        image.setAttribute("class", "img-fluid m-0 p-0");
        image.setAttribute("src", `{% get_media_prefix %}${url}`);
 
        contextImagesOverlay.appendChild(image);
    }

    for (const image of contextImages) {
        addImage(image);
    }  

    const closeOverlayButton = document.createElement("button");
    closeOverlayButton.setAttribute("id", `close-overlay-button`);
    closeOverlayButton.textContent = "Close";
    closeOverlayButton.style.width = "50%";

    closeOverlayButton.addEventListener('click', (function () {
        contextImagesOverlay.style.display = "none";
    }));
    contextImagesOverlay.appendChild(closeOverlayButton);

    const openOverlaybutton = document.createElement('button');
    openOverlaybutton.setAttribute("id", `open-overlay-button`);
    openOverlaybutton.textContent = "View su";

    openOverlaybutton.addEventListener('click', (function () {
        contextImagesOverlay.style.display = "block";
    }));
    document.getElementById("image-manipulator-sliders").parentNode.appendChild(openOverlaybutton);

        

    


</script>
