{% load static %}

<div class="modal" id="previewFixesModal" tabindex="-1" role="dialog" aria-labelledby="previewFixesModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content" style="width: 70vw; margin-left: -200px">
      <div class="modal-header">
        <h5 class="modal-title" id="previewFixesModalLabel">Preview Fixes</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="preview-content">
          <!-- Modal content here -->

        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary me-2 close" data-dismiss="modal" aria-label="Close">Close</button>
        <button id="apply-fixes-button" type="button"
                    class="btn btn-primary me-2"
        >Apply Fixes</button>
      </div>
    </div>
  </div>
</div>
